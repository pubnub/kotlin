# Gradle's PMD plugin has no baseline file. Each entry is the number of PMD violations a module may have
# before `pmdMain` fails (`<project name>=<count>`); a missing entry means 0.
# Record the counts from the first run on master and lower them as violations are fixed.
# pubnub-kotlin-impl only has Java sources under vendor/, which PMD excludes
pubnub-kotlin-impl=0
pubnub-gson-api=22
pubnub-gson-impl=46